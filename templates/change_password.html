<!-- change_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
    
        #container {
            width: 50%;
            margin: auto;
            margin-top: 50px; /* Adjust top margin for spacing */
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
    
        h1 {
            text-align: center;
        }
    
        form {
            margin-top: 20px; /* Adjust top margin for spacing */
        }
    
        label {
            display: block;
            margin-bottom: 10px;
        }
    
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
    
        button[type="submit"] {
            background-color: #44494d; /* Darker color */
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    
        button[type="submit"]:hover {
            background-color: #1c1e21; /* Darker hover color */
        }
    </style>
    
</head>
<body>
    <div id="container">
        <h1>Change Password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
    </div>
</body>
</html>
