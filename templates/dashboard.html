<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <header>
        <h1>Dashboard</h1>
        <nav class="tabs">
            {% if user.is_authenticated %}
                {% if user.is_superuser %}
                    <!-- Admin buttons -->
                    <button onclick="location.href='/admin/'">Admin</button>
                    <button onclick="location.href='/menu/'">Menu</button>
                    <button onclick="location.href='/orderlist/'">Order List</button>
                    <button onclick="location.href='/analytics/sales/'">Sales Analytics</button>
                    <button onclick="location.href='/analytics/menu/'">Menu Analytics</button>
                    <button onclick="location.href='/accounts/logout/'">Logout</button>
                {% elif user.is_staff %}
                    <!-- Employee buttons -->
                    <button onclick="location.href='/menu/'">Menu</button>
                    <button onclick="location.href='/orderlist/'">Order List</button>
                    <button onclick="location.href='/accounts/logout/'">Logout</button>
                {% else %}
                    <!-- Regular user buttons -->
                    <button onclick="location.href='/menu/'">Menu</button>
                    <button onclick="location.href='/orderlist/'">Order List</button>
                    <button onclick="location.href='/accounts/logout/'">Logout</button>
                {% endif %}
            {% else %}
                <!-- Guest buttons (not logged in) -->
                <button onclick="location.href='/menu/'">Menu</button>
                <button onclick="location.href='/cart/'">Cart</button>
                <button onclick="location.href='/checkout/success/'">My Order</button>
            {% endif %}
        </nav>
    </header>

</body>
</html>
