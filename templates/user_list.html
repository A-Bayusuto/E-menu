<!-- user_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    {% include 'dashboard_user.html' %}
</head>
<body>
    <h1>User List</h1>
    <ul>
        {% for user in users %}
            <li>
                {{ user.username }}
                <a href="{% url 'edit_user' user.id %}">
                    <button>Edit</button>
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
